name: huishoudplanner

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: huishoudplanner-app:${APP_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/huishoudplanner}
      PORT: '3000'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backup:
    image: mongo:8
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/huishoudplanner}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ_APP:-Europe/Amsterdam}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./docker/backup.sh:/usr/local/bin/huishoudplanner-backup:ro
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/usr/local/bin/huishoudplanner-backup']

  # Single-node replica set: multi-document transactions need one (ADR-0021). The healthcheck initiates the set on
  # first start, and converts an existing standalone volume the same way; it only reports healthy once this node is
  # the primary. The member host name `mongo` is what the other containers resolve.
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
