name: huishoudplanner

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: huishoudplanner-app:${APP_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/huishoudplanner}
      BACKUP_DIR: /backups
      PORT: '3000'
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
